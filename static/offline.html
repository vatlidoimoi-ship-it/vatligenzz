<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHYEDU - Offline</title>
  <style>
    body {
      align-items: center;
      background: linear-gradient(135deg, #FAFAFA, #EAFBF1, #FFF4E6);
      color: #1f2937;
      display: flex;
      font-family: "Segoe UI", Arial, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(0, 200, 83, .2);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(0, 150, 36, .14);
      max-width: 520px;
      padding: 32px;
      text-align: center;
    }
    h1 {
      color: #009624;
      font-size: 2rem;
      margin: 0 0 12px;
    }
    p {
      color: #64748b;
      line-height: 1.6;
      margin: 0 0 20px;
    }
    button {
      background: linear-gradient(135deg, #FF6D00, #FF9100);
      border: 0;
      border-radius: 999px;
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      padding: 12px 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1>PHYEDU đang offline</h1>
    <p>Thiết bị chưa có mạng. Một số trang đã mở trước đó vẫn có thể xem lại, còn dữ liệu mới cần kết nối internet.</p>
    <button type="button" onclick="location.reload()">Thử tải lại</button>
  </main>
</body>
</html>
